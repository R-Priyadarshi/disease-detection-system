version: '3.8'

services:
  pneumoscan-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pneumoscan_diagnostic_service
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=0
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
