<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Test Grad-CAM Reticle Logo</title>
    <style>
        body {
            background: #06080e;
            color: #f8fafc;
            font-family: system-ui, sans-serif;
            padding: 40px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            align-items: center;
        }
        .row {
            display: flex;
            gap: 30px;
            align-items: center;
        }
        .hero-box {
            width: 140px;
            height: 140px;
            background: radial-gradient(circle at 50% 30%, #151e30 0%, #080a12 100%);
            border: 1px solid rgba(56, 189, 248, 0.35);
            border-radius: 28px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.7), inset 0 1px 2px rgba(255,255,255,0.25);
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .hero-box svg { width: 96px; height: 96px; }
        .nav-box {
            width: 44px;
            height: 44px;
            background: linear-gradient(145deg, #111724 0%, #07090f 100%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.6), inset 0 1px 1px rgba(255, 255, 255, 0.14);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .nav-box svg { width: 32px; height: 32px; }
        .cluster {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #0b0f19;
            padding: 10px 20px;
            border-radius: 12px;
            border: 1px solid rgba(255,255,255,0.08);
        }
        .brand-name {
            font-size: 22px;
            font-weight: 800;
            letter-spacing: 2.5px;
            color: #ffffff;
        }
        .badge {
            font-size: 10px;
            font-weight: 700;
            padding: 2px 8px;
            background: rgba(255,255,255,0.05);
            color: #94a3b8;
            border-radius: 4px;
            letter-spacing: 1px;
        }
        .sub {
            font-size: 11px;
            color: #64748b;
        }
    </style>
</head>
<body>
    <h2>ALVEON GRAD-CAM RETICLE VERIFICATION</h2>
    <div class="row">
        <div class="hero-box">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                <defs>
                    <radialGradient id="alv-reticle-glow-t" cx="31" cy="26" r="8" gradientUnits="userSpaceOnUse">
                        <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
                        <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
                        <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
                    </radialGradient>
                </defs>
                <!-- 3 Thoracic Rib Arcs -->
                <path d="M11 14C15.5 12.8 19.5 14 24 16C28.5 14 32.5 12.8 37 14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
                <path d="M9 22C14.5 20 19.5 22 24 24C28.5 22 33.5 20 39 22" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
                <path d="M10 30C15 28 19.5 30 24 32C28.5 30 33 28 38 30" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
                <!-- Spine Column -->
                <line x1="24" y1="7" x2="24" y2="41" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85"/>
                <!-- Grad-CAM Heatmap Target -->
                <circle cx="31" cy="26" r="9.5" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="2.5 2"/>
                <circle cx="31" cy="26" r="7" fill="url(#alv-reticle-glow-t)"/>
                <circle cx="31" cy="26" r="3.8" fill="#ef4444"/>
                <circle cx="31" cy="26" r="1.8" fill="#ffffff"/>
                <!-- Caliper Crosshairs -->
                <line x1="31" y1="12.5" x2="31" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="31" y1="34" x2="31" y2="39.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="17.5" y1="26" x2="23" y2="26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                <line x1="39" y1="26" x2="44.5" y2="26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
            </svg>
        </div>

        <div class="cluster">
            <div class="nav-box">
                <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <defs>
                        <radialGradient id="alv-reticle-glow-nb" cx="31" cy="26" r="8" gradientUnits="userSpaceOnUse">
                            <stop offset="0%" stop-color="#ef4444" stop-opacity="0.95"/>
                            <stop offset="50%" stop-color="#f59e0b" stop-opacity="0.5"/>
                            <stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/>
                        </radialGradient>
                    </defs>
                    <path d="M11 14C15.5 12.8 19.5 14 24 16C28.5 14 32.5 12.8 37 14" stroke="#94a3b8" stroke-width="1.5" stroke-linecap="round" opacity="0.85"/>
                    <path d="M9 22C14.5 20 19.5 22 24 24C28.5 22 33.5 20 39 22" stroke="#e2e8f0" stroke-width="1.6" stroke-linecap="round" opacity="0.95"/>
                    <path d="M10 30C15 28 19.5 30 24 32C28.5 30 33 28 38 30" stroke="#64748b" stroke-width="1.5" stroke-linecap="round" opacity="0.8"/>
                    <line x1="24" y1="7" x2="24" y2="41" stroke="#cbd5e1" stroke-width="1.8" stroke-dasharray="3 2" opacity="0.85"/>
                    <circle cx="31" cy="26" r="9.5" stroke="#38bdf8" stroke-width="1.3" stroke-dasharray="2.5 2"/>
                    <circle cx="31" cy="26" r="7" fill="url(#alv-reticle-glow-nb)"/>
                    <circle cx="31" cy="26" r="3.8" fill="#ef4444"/>
                    <circle cx="31" cy="26" r="1.8" fill="#ffffff"/>
                    <line x1="31" y1="12.5" x2="31" y2="18" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="31" y1="34" x2="31" y2="39.5" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="17.5" y1="26" x2="23" y2="26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                    <line x1="39" y1="26" x2="44.5" y2="26" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round"/>
                </svg>
            </div>
            <div>
                <div style="display: flex; align-items: center; gap: 8px;">
                    <span class="brand-name">ALVEON</span>
                    <span class="badge">THORACIC PACS</span>
                </div>
                <div class="sub">Precision Radiographic Diagnostic & Emergency Triage Suite</div>
            </div>
        </div>
    </div>
</body>
</html>
