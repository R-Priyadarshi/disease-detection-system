version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: alveon-pacs-engine
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=1
      - ORTHANC_HOST=orthanc
      - ORTHANC_HTTP_PORT=8042
      - ORTHANC_DICOM_PORT=4242
    volumes:
      - alveon_dicom_storage:/app/data/dicom_storage
      - alveon_audit_logs:/app/data
    ports:
      - "11112:11112"  # DICOM Storage SCP Node (Port 11112)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - alveon-net

  orthanc:
    image: orthancteam/orthanc:24.3.0
    container_name: alveon-orthanc-pacs
    restart: always
    ports:
      - "4242:4242"    # Orthanc DICOM DIMSE C-STORE / C-FIND
      - "8042:8042"    # Orthanc REST API / Web Explorer
    environment:
      - ORTHANC_NAME=ORTHANC_HOSPITAL_PACS
    volumes:
      - ./orthanc.json:/etc/orthanc/orthanc.json:ro
      - orthanc_storage:/var/lib/orthanc/db
    networks:
      - alveon-net

  proxy:
    image: nginx:1.25-alpine
    container_name: alveon-nginx-proxy
    restart: always
    ports:
      - "80:80"        # HTTP Reverse Proxy
      - "443:443"      # HTTPS TLS 1.3 Port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - app
    networks:
      - alveon-net

networks:
  alveon-net:
    driver: bridge

volumes:
  alveon_dicom_storage:
    driver: local
  alveon_audit_logs:
    driver: local
  orthanc_storage:
    driver: local
