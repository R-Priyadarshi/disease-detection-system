version: '3.8'

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: alveon-pacs-engine
    restart: always
    environment:
      - PYTHONUNBUFFERED=1
      - TF_ENABLE_ONEDNN_OPTS=1
    volumes:
      - alveon_dicom_storage:/app/data/dicom_storage
      - alveon_audit_logs:/app/data
    ports:
      - "11112:11112"  # DICOM Storage SCP Node (Port 11112)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - alveon-net

  proxy:
    image: nginx:1.25-alpine
    container_name: alveon-nginx-proxy
    restart: always
    ports:
      - "80:80"        # HTTP Reverse Proxy
      - "443:443"      # HTTPS TLS Port
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
    networks:
      - alveon-net

networks:
  alveon-net:
    driver: bridge

volumes:
  alveon_dicom_storage:
    driver: local
  alveon_audit_logs:
    driver: local
