# ALVEON Production Enterprise Nginx Reverse Proxy Configuration
# Compliant with HIPAA Security Rule § 164.312(e)(1) Transmission Security & NIST SP 800-52

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';

    access_log /var/log/nginx/access.log main;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 250M;  # Support large 3D CT/MRI volumetric DICOM series uploads

    # Gzip compression for high-performance DICOM JSON & UI transfers
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss text/javascript;

    # Rate limiting zone for public endpoints
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=50r/s;

    upstream alveon_backend {
        server app:8000;
        keepalive 32;
    }

    upstream orthanc_backend {
        server orthanc:8042;
        keepalive 16;
    }

    # HTTP Server (Port 80)
    server {
        listen 80;
        listen [::]:80;
        server_name localhost;

        # Health & Readiness Probes
        location ~ ^/(health|healthz|readyz) {
            proxy_pass http://alveon_backend;
            access_log off;
        }

        # Security Headers (HIPAA / OWASP Recommendations)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;

        # Web Client & Static Assets
        location / {
            proxy_pass http://alveon_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
        }

        # REST API & DICOMweb Endpoints
        location ~ ^/(api|dicomweb)/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://alveon_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        # Orthanc Web Proxy (if enabled)
        location /orthanc/ {
            proxy_pass http://orthanc_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }

    # HTTPS Server (Port 443 - TLS 1.3 Hardened)
    server {
        listen 443 ssl;
        listen [::]:443 ssl;
        http2 on;
        server_name localhost;

        ssl_certificate /etc/nginx/certs/alveon_tls.crt;
        ssl_certificate_key /etc/nginx/certs/alveon_tls.key;

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:10m;
        ssl_session_tickets off;

        # Security Headers (HIPAA / OWASP Recommendations)
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        location ~ ^/(health|healthz|readyz) {
            proxy_pass http://alveon_backend;
            access_log off;
        }

        location / {
            proxy_pass http://alveon_backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
        }

        location ~ ^/(api|dicomweb)/ {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://alveon_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_read_timeout 300s;
            proxy_buffering off;
        }

        location /orthanc/ {
            proxy_pass http://orthanc_backend/;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }
    }
}
