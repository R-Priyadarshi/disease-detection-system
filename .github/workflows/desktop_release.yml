name: Build & Release Desktop Workstation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            artifact_name: Linux-Packages
            build_script: npm run build:linux
          - os: windows-latest
            artifact_name: Windows-Installer
            build_script: npm run build:win
          - os: macos-latest
            artifact_name: macOS-DMG
            build_script: npm run build:mac

    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: desktop/package.json

      - name: Install Electron Build Dependencies
        working-directory: desktop
        run: npm ci || npm install

      - name: Compile and Package Binaries
        working-directory: desktop
        run: ${{ matrix.build_script }}

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ALVEON-PACS-${{ matrix.artifact_name }}
          path: desktop/dist/*.*

  release:
    name: Publish GitHub Release
    needs: build-desktop
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Download Build Artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
